<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBF Firmas e Poderes — Visão macro da plataforma</title>
  <style>
    :root {
      --navy: #222239;
      --navy-soft: #2e2e4a;
      --navy-deep: #181828;
      --orange: #FF5315;
      --mint: #89BAB1;
      --vanilla: #FFE2A9;
      --off-white: #F7F6F2;
      --grey-light: #E8E7E2;
      --grey-dark: #555463;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--navy-deep);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy-deep);
    }
    svg { width: 100%; height: 100%; background: var(--off-white); }
    @media print {
      @page { size: landscape; margin: 0; }
      html, body, .stage { width: 100%; height: 100%; background: #fff; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
      <title id="t">BBF Firmas e Poderes — Visão macro da plataforma</title>
      <desc id="d">Quatro containers Docker, operador, auditor e integração KAAS Foursys.</desc>
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#222239"/>
        </marker>
        <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF"/>
        </marker>
        <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF5315"/>
        </marker>
      </defs>

      <rect width="1920" height="1080" fill="#F7F6F2"/>
      <rect width="1920" height="6" fill="#FF5315"/>

      <text x="48" y="42" fill="#FF5315" font-size="15" font-weight="700" letter-spacing="2.4">PLATAFORMA BBF · BRADESCO</text>
      <text x="48" y="82" fill="#222239" font-size="34" font-weight="800">Visão macro da plataforma</text>
      <text x="1872" y="82" fill="#555463" font-size="16" text-anchor="end">4 containers · rede bbf-internal</text>

      <!-- G1 Atores -->
      <rect x="36" y="118" width="312" height="748" rx="14" fill="#FFFFFF" stroke="#E8E7E2" stroke-width="2"/>
      <text x="56" y="148" fill="#FF5315" font-size="13" font-weight="700" letter-spacing="1.8">ATORES</text>

      <rect x="56" y="172" width="272" height="150" rx="12" fill="#FFE2A9" stroke="#222239" stroke-width="2"/>
      <text x="192" y="232" text-anchor="middle" fill="#222239" font-size="22" font-weight="800">Operador</text>
      <text x="192" y="262" text-anchor="middle" fill="#222239" font-size="14">Upload, consulta e checagem de poderes</text>

      <rect x="56" y="360" width="272" height="150" rx="12" fill="#FFE2A9" stroke="#222239" stroke-width="2"/>
      <text x="192" y="420" text-anchor="middle" fill="#222239" font-size="22" font-weight="800">Auditor</text>
      <text x="192" y="450" text-anchor="middle" fill="#222239" font-size="14">Trilha WORM e replay de decisão</text>

      <text x="192" y="560" text-anchor="middle" fill="#555463" font-size="13">Perfis JWT desenhados.</text>
      <text x="192" y="580" text-anchor="middle" fill="#555463" font-size="13">admin / consumer omitidos.</text>

      <!-- G2 Docker -->
      <rect x="368" y="118" width="1004" height="748" rx="14" fill="#FFFFFF" stroke="#E8E7E2" stroke-width="2"/>
      <text x="388" y="148" fill="#FF5315" font-size="13" font-weight="700" letter-spacing="1.8">REDE INTERNA DOCKER · bbf-internal</text>

      <rect x="500" y="172" width="740" height="118" rx="12" fill="#89BAB1" stroke="#222239" stroke-width="2"/>
      <text x="870" y="214" text-anchor="middle" fill="#222239" font-size="22" font-weight="800">Frontend Web</text>
      <text x="870" y="242" text-anchor="middle" fill="#222239" font-size="14">Next.js 14 — dashboard, envio, decisão, auditoria</text>
      <rect x="1088" y="186" width="132" height="28" rx="6" fill="#F7F6F2" stroke="#222239" stroke-width="1"/>
      <text x="1154" y="205" text-anchor="middle" fill="#222239" font-size="12" font-weight="700">Filas / resultado</text>

      <rect x="404" y="360" width="420" height="196" rx="12" fill="#2e2e4a" stroke="#222239" stroke-width="2"/>
      <text x="614" y="412" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800">API</text>
      <text x="614" y="444" text-anchor="middle" fill="#FFFFFF" font-size="15">.NET 8 — JWT, validação, orquestração HTTP</text>
      <text x="614" y="470" text-anchor="middle" fill="#FFE2A9" font-size="14">container api · porta 8080</text>
      <rect x="534" y="492" width="160" height="28" rx="6" fill="#181828" stroke="#FF5315" stroke-width="1.5"/>
      <text x="614" y="511" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Login JWT</text>

      <rect x="868" y="336" width="464" height="244" rx="14" fill="#181828" stroke="#FF5315" stroke-width="4"/>
      <text x="1100" y="392" text-anchor="middle" fill="#FF5315" font-size="13" font-weight="700" letter-spacing="2">DESTAQUE · PROCESSAMENTO</text>
      <text x="1100" y="434" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="800">Worker</text>
      <text x="1100" y="470" text-anchor="middle" fill="#FFFFFF" font-size="16">.NET 8 — consome outbox e aciona KAAS</text>
      <text x="1100" y="500" text-anchor="middle" fill="#FFE2A9" font-size="14">container worker · a API não chama o KAAS</text>
      <text x="1100" y="534" text-anchor="middle" fill="#89BAB1" font-size="13">poll ~5s · POST sync · X-Flow-Api-Key</text>

      <rect x="500" y="640" width="740" height="172" rx="12" fill="#222239" stroke="#181828" stroke-width="2"/>
      <text x="870" y="698" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800">PostgreSQL</text>
      <text x="870" y="732" text-anchor="middle" fill="#FFFFFF" font-size="15">Postgres 16 — protocolo, status, canônico, decisão, outbox, auditoria</text>
      <text x="870" y="762" text-anchor="middle" fill="#FFE2A9" font-size="14">container db · sem porta no host · outbox é tabela, não broker</text>

      <!-- G3 KAAS -->
      <rect x="1392" y="118" width="492" height="748" rx="14" fill="#FFFFFF" stroke="#E8E7E2" stroke-width="2"/>
      <text x="1412" y="148" fill="#FF5315" font-size="13" font-weight="700" letter-spacing="1.8">INTEGRAÇÃO EXTERNA</text>

      <rect x="1420" y="336" width="436" height="244" rx="14" fill="#181828" stroke="#FF5315" stroke-width="3"/>
      <text x="1638" y="400" text-anchor="middle" fill="#FF5315" font-size="13" font-weight="700" letter-spacing="2">FOURSYS</text>
      <text x="1638" y="444" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="800">KAAS (Foursys)</text>
      <text x="1638" y="480" text-anchor="middle" fill="#FFFFFF" font-size="15">Workflow — análise do documento</text>
      <text x="1638" y="508" text-anchor="middle" fill="#FFE2A9" font-size="14">sócios e poderes (estrutura)</text>
      <text x="1638" y="536" text-anchor="middle" fill="#89BAB1" font-size="13">jornada testes-firmas-e-poderes</text>

      <text x="1638" y="640" text-anchor="middle" fill="#555463" font-size="14">A decisão APROVADO /</text>
      <text x="1638" y="662" text-anchor="middle" fill="#555463" font-size="14">REPROVADO / MANUAL sai do</text>
      <text x="1638" y="684" text-anchor="middle" fill="#222239" font-size="14" font-weight="700">motor de regras na API,</text>
      <text x="1638" y="706" text-anchor="middle" fill="#555463" font-size="14">não do KAAS.</text>

      <!-- Conexões (acima dos grupos, abaixo dos nós: nós já desenhados; linhas por cima) -->
      <!-- C1 Operador → Web -->
      <path d="M 328 247 H 500" fill="none" stroke="#222239" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="352" y="218" width="120" height="22" rx="4" fill="#F7F6F2"/>
      <text x="412" y="234" text-anchor="middle" fill="#222239" font-size="12" font-weight="600">Usa a interface</text>

      <!-- C2 Auditor → Web -->
      <path d="M 328 435 H 388 V 276 H 500" fill="none" stroke="#222239" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="200" y="328" width="120" height="22" rx="4" fill="#F7F6F2"/>
      <text x="260" y="344" text-anchor="middle" fill="#222239" font-size="12" font-weight="600">Usa a interface</text>

      <!-- C3 Web → API -->
      <path d="M 700 290 V 325 H 614 V 360" fill="none" stroke="#222239" stroke-width="2" marker-end="url(#arrw)"/>
      <rect x="628" y="300" width="96" height="22" rx="4" fill="#F7F6F2"/>
      <text x="676" y="316" text-anchor="middle" fill="#222239" font-size="12" font-weight="600">HTTP + JWT</text>

      <!-- C4 API → PostgreSQL -->
      <path d="M 614 556 V 600 H 680 V 640" fill="none" stroke="#222239" stroke-width="2" marker-end="url(#arrw)"/>
      <rect x="548" y="572" width="128" height="22" rx="4" fill="#F7F6F2"/>
      <text x="612" y="588" text-anchor="middle" fill="#222239" font-size="12" font-weight="600">EF Core / Npgsql</text>

      <!-- C6 Worker → PG poll -->
      <path d="M 980 580 V 610 H 860 V 640" fill="none" stroke="#222239" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrw)"/>
      <rect x="868" y="588" width="168" height="22" rx="4" fill="#F7F6F2"/>
      <text x="952" y="604" text-anchor="middle" fill="#222239" font-size="12" font-weight="600">Lê outbox document.uploaded</text>

      <!-- C10 Worker → PG persist -->
      <path d="M 1220 580 V 610 H 1100 V 640" fill="none" stroke="#222239" stroke-width="2" marker-end="url(#arrw)"/>
      <rect x="1118" y="588" width="156" height="22" rx="4" fill="#F7F6F2"/>
      <text x="1196" y="604" text-anchor="middle" fill="#222239" font-size="12" font-weight="600">Grava kas_runs e status</text>

      <!-- C8 Worker → KAAS -->
      <path d="M 1332 410 H 1420" fill="none" stroke="#FF5315" stroke-width="2.5" marker-end="url(#arro)"/>
      <rect x="1336" y="382" width="80" height="22" rx="4" fill="#F7F6F2"/>
      <text x="1376" y="398" text-anchor="middle" fill="#222239" font-size="11" font-weight="700">POST jornada</text>

      <!-- C9 KAAS → Worker -->
      <path d="M 1420 506 H 1332" fill="none" stroke="#FF5315" stroke-width="2.5" marker-end="url(#arro)"/>
      <rect x="1330" y="512" width="88" height="22" rx="4" fill="#F7F6F2"/>
      <text x="1374" y="528" text-anchor="middle" fill="#222239" font-size="11" font-weight="700">Resposta sync</text>

      <!-- Legenda -->
      <rect x="36" y="888" width="1848" height="148" rx="12" fill="#FFFFFF" stroke="#E8E7E2" stroke-width="2"/>
      <text x="56" y="920" fill="#FF5315" font-size="12" font-weight="700" letter-spacing="1.8">LEGENDA</text>

      <rect x="56" y="940" width="22" height="22" rx="4" fill="#FFE2A9" stroke="#222239"/>
      <text x="86" y="957" fill="#222239" font-size="14">Atores</text>
      <rect x="200" y="940" width="22" height="22" rx="4" fill="#89BAB1" stroke="#222239"/>
      <text x="230" y="957" fill="#222239" font-size="14">Frontend Next.js</text>
      <rect x="400" y="940" width="22" height="22" rx="4" fill="#2e2e4a" stroke="#222239"/>
      <text x="430" y="957" fill="#222239" font-size="14">Backend API .NET</text>
      <rect x="610" y="940" width="22" height="22" rx="4" fill="#181828" stroke="#FF5315" stroke-width="3"/>
      <text x="640" y="957" fill="#222239" font-size="14">Worker .NET</text>
      <rect x="790" y="940" width="22" height="22" rx="4" fill="#222239" stroke="#181828"/>
      <text x="820" y="957" fill="#222239" font-size="14">PostgreSQL</text>
      <rect x="960" y="940" width="22" height="22" rx="4" fill="#181828" stroke="#FF5315" stroke-width="2"/>
      <text x="990" y="957" fill="#222239" font-size="14">Integração KAAS</text>

      <line x1="56" y1="996" x2="120" y2="996" stroke="#222239" stroke-width="2" marker-end="url(#arr)"/>
      <text x="132" y="1001" fill="#222239" font-size="14">HTTP / persistência</text>
      <line x1="360" y1="996" x2="424" y2="996" stroke="#222239" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr)"/>
      <text x="436" y="1001" fill="#222239" font-size="14">Poll / outbox</text>
      <line x1="600" y1="996" x2="664" y2="996" stroke="#222239" stroke-width="2" stroke-dasharray="2 6" marker-end="url(#arr)"/>
      <text x="676" y="1001" fill="#222239" font-size="14">Auditoria / replay</text>

      <text x="1872" y="1001" text-anchor="end" fill="#555463" font-size="13">BBF Firmas e Poderes · 28/08/2026</text>
    </svg>
  </div>
</body>
</html>
