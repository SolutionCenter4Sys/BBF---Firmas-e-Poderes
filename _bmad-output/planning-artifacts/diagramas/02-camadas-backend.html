<!DOCTYPE html>

<head>

  <style>
    :root {
      --navy: #222239;

      --orange: #FF5315;

      --off-white: #F7F6F2;

    html, body { width: 100%; height: 100%; background: var(--navy-deep); font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

    @media print {
      @page { size: landscape; margin: 0; }

  </style>
</head>
<body>
  <div class="stage">

      <desc id="d">Organização lógica da API e do Worker: Domain, Infrastructure, dados e KAAS.</desc>

      <rect width="1920" height="1080" fill="#F7F6F2"/>

      <text x="1872" y="74" fill="#555463" font-size="15" text-anchor="end">Domain · Infrastructure · sem classes</text>
